# Track 1 sim topology. One container per worker: the bridge spawns an
# episode container with a random host port mapped to 5760 (SITL MAVLink).
# Static multi-worker pools: docker compose up -d --scale worker=N
# (each replica gets its own Gazebo+SITL pair; query ports per container).
services:
  worker:
    build: .
    image: dmb/sim:track1
    shm_size: 2gb
    ports:
      - "5760"
