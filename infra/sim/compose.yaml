# Track 1 sim topology. One `worker` replica per parallel eval sample gives
# per-sample SITL isolation; scale replicas with inspect-ai concurrency.
services:
  sim:
    build: .
    image: dmb/sim:track1
    shm_size: 2gb
    environment:
      - DISPLAY=${DISPLAY:-}
    # Headless software rendering by default; GPU passthrough is a later issue.
    command: ["gz", "sim", "-v4", "-r", "-s", "shapes.sdf"]
