    use: T1 dense smoke particle config + fog ramp; haze bank base
  smoke-generator:
    url: https://fuel.gazebosim.org/1.0/caguero/models/smoke_generator/2/smoke_generator.zip
    version: 2
    sha256: 5170fd23e85a083ad10aae18f6d446d908ec0110d4b595f8379d832e26dd1493
    license: CC-BY-4.0
    use: T1 smoke texture (smoke.png) + emitter numerics; Harmonic ignores model plugin blocks so build_world.py rehosts the model's own params in SDF particle_emitter elements. Smoke runs as one thin column (30/2.5m/3.0s, 8-12m/s). Ogre2 ignores <lifetime>, so any vel > 0 grows a pillar of height vel x age (2026-11-04 rig); the fire is therefore a ZERO-velocity box-type flame_bed (14x14x1.5 m volume, orange diffuse, 60/s, 2m) on a dark burned-ground scorch decal -- low, broad, textured, pillar-free and stable at 200 s+ (documented adaptations).
