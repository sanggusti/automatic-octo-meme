# Sourced spec: ArduPlane + ardupilot_gazebo zephyr flying wing.
# NOTE: no bench backend flies this yet (SITL runs ArduCopter); the spec
# exists so missions can declare fixed-wing requirements and fail loudly.
name: fixedwing_scout
vehicle_class: fixed-wing
provenance:
  params: https://github.com/ArduPilot/ardupilot/blob/Copter-4.6.3/Tools/autotest/default_params/gazebo-zephyr.parm
  model: https://github.com/ArduPilot/ardupilot_gazebo/blob/80dc9664/models/zephyr_with_ardupilot/model.sdf
  docs: https://ardupilot.org/plane/docs/guided-mode.html
# Sensors: SITL gps/baro/mag/imu. ARSPD_TYPE 0 in the parm file (no pitot);
# no gimbal on zephyr_with_ardupilot (plain airframe).
sensors:
  - gps
  - barometer
  - magnetometer
  - imu
capabilities:
  guided_takeoff: false # Plane GUIDED is fly-to-point only (guided-mode doc); takeoff runs in AUTO
  guided_goto: true # Plane GUIDED fly-to-point via L1 controller (guided-mode doc)
  non_gps_nav: false # no non-GPS position source in the parm file
  nav_mesh_planning: false # no nav mesh in the stack
  rtl: true # ArduPlane RTL mode
  loiter: true # ArduPlane LOITER mode (+ fence-return loiter in guided-mode doc)
  auto_mission: true # ArduPlane AUTO: waypoint nav + TAKEOFF command
  max_speed_ms: 12.0 # TRIM_ARSPD_CM default 1200 cm/s (plane params doc)
  flight_time_min: null # not stated in ArduPilot sources; unmodelled
sitl_params:
  SERVO1_FUNCTION: 77
  SERVO2_FUNCTION: 78
  SERVO1_REVERSED: 1
  SERVO2_REVERSED: 1
  INS_ACCOFFS_X: 0.001
  INS_ACCOFFS_Y: 0.001
  INS_ACCOFFS_Z: 0.001
  INS_ACCSCAL_X: 1.001
  INS_ACCSCAL_Y: 1.001
  INS_ACCSCAL_Z: 1.001
  INS_ACC2OFFS_X: 0.001
  INS_ACC2OFFS_Y: 0.001
  INS_ACC2OFFS_Z: 0.001
  INS_ACC2SCAL_X: 1.001
  INS_ACC2SCAL_Y: 1.001
  INS_ACC2SCAL_Z: 1.001
  INS_GYR_CAL: 0
  ARSPD_TYPE: 0
  BATT_MONITOR: 4
gazebo_model: zephyr_with_ardupilot
