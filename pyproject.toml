[project]
name = "disaster-mitigation-bench"
version = "0.1.0"
description = "Benchmarking language models as drone navigators and reconnaissance advisors in simulated 3D disaster environments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "inspect-ai>=0.3",
  "pyyaml>=6",
]

[project.optional-dependencies]
sim = ["pymavlink>=2.4"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dmb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
