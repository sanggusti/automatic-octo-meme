name: landslide
kind: Landslide (slope debris)
description: >-
  Slope failure over a hillside road. Victims are buried or stranded along
  the debris path; ground is unstable and the slide may extend. Hazard zones
  mark the active slip face.
grid:
  width: 10
  height: 12
victims:
  categories:
    human:
      min: 1
      max: 3
      mobility: static
    child:
      min: 0
      max: 1
      mobility: static
    animal:
      min: 1
      max: 2
      mobility: static
hazards:
  - {x: 5, y: 9, radius: 2.0, label: slip-face}
weather:
  - rain-heavy
  - overcast
difficulty:
  visibility: low
  victim_mobility: static
  hazard_drift: true
dynamics:
  terrain:
    candidates:
      - {x: 5, y: 8, slope: 1.5}
      - {x: 4, y: 7, slope: 1.0}
    sat_rate: 0.05
    rain_multiplier: 2.0
    raining: true
    threshold: 1.0
    debris_dir: [0, 1]
    debris_len: 3
    # Weather coupling (#18): rain-heavy keeps raining; overcast dries it.
    weather_modifiers:
      rain-heavy: {raining: true}
      overcast: {raining: false}
